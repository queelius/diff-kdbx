[package]
name = "diff-kdbx"
description = "Semantic diff for KeePass KDBX files"
version = "0.1.0"
edition = "2024"
# keepass 0.15 (the CLI's file reader) requires 1.89.
rust-version = "1.89"
authors = ["Alexander Towell <lex@metafunctor.com>"]
license = "MIT"
repository = "https://github.com/queelius/diff-kdbx"
documentation = "https://docs.rs/diff-kdbx"
readme = "README.md"
keywords = ["keepass", "kdbx", "diff", "git"]
categories = ["command-line-utilities", "cryptography"]
# Fixtures and snapshots stay in the package so `cargo test` works from the
# tarball; CI config, agent notes, design docs and proptest seeds do not.
exclude = [".github/", "CLAUDE.md", "docs/superpowers/", "*.proptest-regressions"]

[dependencies]
# The vault model and the ecosystem's shared rules. No keepass, no KDF by
# default: the library is a pure function of two snapshots.
kdbx-core = { version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["std"] }
# Formats timestamps in the JSON wire format (already in the graph through
# kdbx-core; no clock, no wasm-bindgen).
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# CLI-only dependencies.
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
rpassword = { version = "7", optional = true }
# The CLI opens files with keepass 0.15 (reads KDBX 3.1, 4.0 and 4.1).
keepass = { version = "0.15.3", default-features = false, optional = true }
# Wipes the CLI's password and key-file bytes on drop.
zeroize = { version = "1", optional = true }

[features]
default = []
cli = [
    "dep:clap",
    "dep:anyhow",
    "dep:rpassword",
    "dep:keepass",
    "kdbx-core/keepass-0_15",
    "kdbx-core/kdf",
    "dep:zeroize",
]

[dev-dependencies]
insta = "1"
proptest = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Tests capture the committed fixture vaults; examples/gen_fixtures.rs
# builds and saves them.
kdbx-core = { version = "0.1.0", default-features = false, features = ["keepass-0_15"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false }
keepass = { version = "0.15.3", features = ["save_kdbx4"] }
# Names keepass's Argon2 version type when tests and the fixture generator
# choose a vault's KDF (already in the graph through keepass).
rust_argon2 = { package = "rust-argon2", version = "3", default-features = false }

[[bin]]
name = "diff-kdbx"
required-features = ["cli"]

# Argon2 (fingerprint key derivation, and keepass's own KDF) is unbearably
# slow without optimization, and the CLI tests open many vaults.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.rust-argon2]
opt-level = 3
